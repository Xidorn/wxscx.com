    <section id="metrics" class="metrics"></section>

        <article class="panel" id="registrarPanel"><div class="panel-head"><div class="panel-title" data-i18n="registrarInfo">Registrar & Registry</div></div><div class="panel-body" id="registrarBody"></div></article>
        <details class="raw" id="whoisRaw"><summary><span data-i18n="rawWhois">Raw WHOIS</span><span class="raw-actions"><button type="button" class="raw-copy" data-rawcopy="whois" data-i18n="copy">Copy</button><span>＋</span></span></summary><div class="raw-body"><pre id="whoisText"></pre></div></details>
        <details class="raw" id="rdapRaw"><summary><span data-i18n="rawRdap">Raw RDAP</span><span class="raw-actions"><button type="button" class="raw-copy" data-rawcopy="rdap" data-i18n="copy">Copy</button><span>＋</span></span></summary><div class="raw-body"><pre id="rdapText"></pre></div></details>
      </div>
      <aside class="stack">
        <article class="panel" id="dnsPanel"><div class="panel-head"><div class="panel-title" data-i18n="dns">DNS</div></div><div class="panel-body" id="dnsBody"></div></article>
        <article class="panel" id="statusPanel"><div class="panel-head"><div class="panel-title" data-i18n="status">Domain Status</div></div><div class="panel-body"><div class="list" id="statusList"></div></div></article>
        <article class="panel" id="lifecyclePanel" hidden><div class="panel-head"><div class="panel-title" data-i18n="lifecycle">Lifecycle</div></div><div class="panel-body"><div class="lifecycle" id="lifecycleList"></div></div></article>
      </aside>
    </section>
  </div>
  <footer class="footer">© <span id="year"></span> Mr Wang</footer>
</main>

function metric(label,value,note=''){if(!value)return'';return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div>${note?`<div class="metric-note">${esc(note)}</div>`:''}</div>`}
function prettyRdap(v){if(!v)return'';try{return JSON.stringify(JSON.parse(v),null,2)}catch{return v}}
function render(d){currentData=d;const displayDomain=d.domain||domain;document.title=`${displayDomain} · Domain Intelligence | Mr Wang`;document.getElementById('domainTitle').textContent=displayDomain;const state=stateOf(d),badge=document.getElementById('stateBadge');badge.className='badge '+state;badge.querySelector('span').textContent=t(state);const rq=document.getElementById('registrarQuick');rq.textContent=d.registrar||'';rq.hidden=!d.registrar;
 const notice=document.getElementById('stateNotice');const noticeKey=state==='reserved'?'reservedNotice':state==='available'?'availableNotice':state==='unknown'?'unknownNotice':'';notice.hidden=!noticeKey;notice.innerHTML=noticeKey?`<strong>${esc(t(state))}.</strong> ${esc(t(noticeKey))}`:'';
 let metrics='';metrics+=metric(t('domainAge'),humanDuration(d.createdAgo),d.creationDateISO8601||d.creationDate?`${t('created')}: ${fmtDate(d.creationDateISO8601||d.creationDate)}`:'');metrics+=metric(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate),d.expiresIn?`${t('expiresIn')}: ${humanDuration(d.expiresIn)}`:'');metrics+=metric(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate),d.updatedAgo?`${t('updatedAgo')}: ${humanDuration(d.updatedAgo)}`:'');metrics+=metric(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate),d.availableIn?`${t('availableIn')}: ${humanDuration(d.availableIn)}`:'');document.getElementById('metrics').innerHTML=metrics;document.getElementById('metrics').hidden=!metrics;
 let reg='';reg+=row(t('created'),fmtDate(d.creationDateISO8601||d.creationDate));reg+=row(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate));reg+=row(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate));reg+=row(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate));setPanel('registrationPanel',reg);
 let rr='';rr+=row(t('registrar'),d.registrar);rr+=row(t('iana'),d.registrarIANAId);rr+=row(t('registrarUrl'),d.registrarURL,true);rr+=row(t('whoisServer'),d.registrarWHOISServer);rr+=row(t('rdapServer'),d.registrarRDAPServer,true);rr+=row(t('registryWebsite'),d.registryWebsite,true);rr+=row(t('registryWhois'),d.registryWHOISServer);rr+=row(t('registryRdap'),d.registryRDAPServer,true);setPanel('registrarPanel',rr);
 let dns='';if(Array.isArray(d.nameServers)&&d.nameServers.length){dns+=`<div class="row"><div class="key">${esc(t('nameServers'))}</div><div class="value"><div class="list">${d.nameServers.map(ns=>`<div class="item"><div class="item-main"><div class="item-title">${esc(ns)}</div></div><button type="button" class="copy" data-copy="${esc(ns)}">${esc(t('copy'))}</button></div>`).join('')}</div></div></div>`}if(d.dnssecSigned!==null&&d.dnssecSigned!==undefined)dns+=row(t('dnssec'),d.dnssecSigned?t('signed'):t('unsigned'));setPanel('dnsPanel',dns);
 let statuses=Array.isArray(d.status)?d.status:[];if(!statuses.length&&state==='reserved')statuses=[{text:t('reserved'),url:''}];const sl=document.getElementById('statusList');sl.innerHTML=statuses.map(s=>{const txt=typeof s==='string'?s:(s.text||'');const u=typeof s==='object'?safeUrl(s.url||''):'';return `<div class="item"><div class="item-main"><div class="item-title">${esc(txt)}</div>${statusSub(txt)?`<div class="item-sub">${esc(statusSub(txt))}</div>`:''}</div>${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">↗</a>`:''}</div>`}).join('');document.getElementById('statusPanel').hidden=!statuses.length;
 const lifes=[];if(d.gracePeriod)lifes.push([t('grace'),'warning']);if(d.redemptionPeriod)lifes.push([t('redemption'),'warning']);if(d.pendingDelete)lifes.push([t('pendingDelete'),'']);if(d.hold)lifes.push([t('hold'),'']);if(d.inactive)lifes.push([t('inactive'),'warning']);document.getElementById('lifecycleList').innerHTML=lifes.map(([x,c])=>`<div class="life ${c}"><span>${esc(x)}</span><span>${esc(t('yes'))}</span></div>`).join('');document.getElementById('lifecyclePanel').hidden=!lifes.length;
 const whois=d.whoisData||'',rdap=prettyRdap(d.rdapData||'');document.getElementById('whoisText').textContent=whois;document.getElementById('whoisRaw').hidden=!whois;document.getElementById('rdapText').textContent=rdap;document.getElementById('rdapRaw').hidden=!rdap;
 document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>copyText(btn,btn.dataset.copy));
}
async function copyText(btn,text){try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent=t('copied');setTimeout(()=>btn.textContent=old,1100)}catch{}}
document.querySelectorAll('[data-rawcopy]').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const txt=btn.dataset.rawcopy==='rdap'?document.getElementById('rdapText').textContent:document.getElementById('whoisText').textContent;copyText(btn,txt)}));
async function load(){applyLang();if(!domain||!validDomain(domain)){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=t('invalid');return}try{const r=await fetch(API+encodeURIComponent(domain),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j||j.code!==0||!j.data)throw new Error(j?.msg||'Query failed');document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;render(j.data)}catch(err){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=`${t('failed')} ${err?.message||''}`}}
document.getElementById('year').textContent=new Date().getFullYear();load();
</script>
</body>
</html>
