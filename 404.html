const statusMap={'Client Transfer Prohibited':{zh:'禁止客户端转移',de:'Client-Transfer gesperrt',fr:'Transfert client interdit',ja:'クライアント転送禁止',es:'Transferencia de cliente prohibida'},'Client Update Prohibited':{zh:'禁止客户端更新',de:'Client-Update gesperrt',fr:'Mise à jour client interdite',ja:'クライアント更新禁止',es:'Actualización de cliente prohibida'},'Client Delete Prohibited':{zh:'禁止客户端删除',de:'Client-Löschung gesperrt',fr:'Suppression client interdite',ja:'クライアント削除禁止',es:'Eliminación de cliente prohibida'},'Active':{zh:'正常激活',de:'Aktiv',fr:'Actif',ja:'有効',es:'Activo'},'OK':{zh:'正常',de:'OK',fr:'OK',ja:'正常',es:'OK'}};const statusSub=txt=>lang==='en'?'':(statusMap[txt]?.[lang]||'');
function render(d){currentData=d;const displayDomain=d.domain||domain;document.title=`${displayDomain} | Global Domain Lookup`;document.getElementById('domainTitle').textContent=displayDomain;const state=stateOf(d),badge=document.getElementById('stateBadge');badge.className='badge '+state;badge.querySelector('span').textContent=t(state);const rq=document.getElementById('registrarQuick');rq.textContent=d.registrar||'';rq.hidden=!d.registrar;const notice=document.getElementById('stateNotice');const nk=state==='reserved'?'reservedNotice':state==='available'?'availableNotice':state==='unknown'?'unknownNotice':'';notice.hidden=!nk;notice.innerHTML=nk?`<strong>${esc(t(state))}.</strong> ${esc(t(nk))}`:'';
let metrics='';metrics+=metric(t('domainAge'),humanDuration(d.createdAgo),d.creationDateISO8601||d.creationDate?`${t('created')}: ${fmtDate(d.creationDateISO8601||d.creationDate)}`:'');metrics+=metric(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate),d.expiresIn?`${t('expiresIn')}: ${humanDuration(d.expiresIn)}`:'');metrics+=metric(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate),d.updatedAgo?`${t('updatedAgo')}: ${humanDuration(d.updatedAgo)}`:'');metrics+=metric(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate),d.availableIn?`${t('availableIn')}: ${humanDuration(d.availableIn)}`:'');const me=document.getElementById('metrics');me.innerHTML=metrics;me.hidden=!metrics;
let reg='';reg+=row(t('created'),fmtDate(d.creationDateISO8601||d.creationDate));reg+=row(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate));reg+=row(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate));reg+=row(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate));setPanel('registrationPanel',reg);
let rr='';rr+=row(t('registrar'),d.registrar);rr+=row(t('iana'),d.registrarIANAId);rr+=row(t('registrarUrl'),d.registrarURL,true);rr+=row(t('whoisServer'),d.registrarWHOISServer);rr+=row(t('rdapServer'),d.registrarRDAPServer,true);rr+=row(t('registryWebsite'),d.registryWebsite,true);rr+=row(t('registryWhois'),d.registryWHOISServer);rr+=row(t('registryRdap'),d.registryRDAPServer,true);setPanel('registrarPanel',rr);
let dns='';if(Array.isArray(d.nameServers)&&d.nameServers.length){dns+=`<div class="dns-list"><div class="dns-label">${esc(t('nameServers'))}</div>${d.nameServers.map(ns=>`<div class="dns-item">${esc(ns)}</div>`).join('')}</div>`}if(d.dnssecSigned!==null&&d.dnssecSigned!==undefined)dns+=row(t('dnssec'),d.dnssecSigned?t('signed'):t('unsigned'));setPanel('dnsPanel',dns);
let statuses=Array.isArray(d.status)?d.status:[];if(!statuses.length&&state==='reserved')statuses=[{text:t('reserved'),url:''}];document.getElementById('statusList').innerHTML=statuses.map(s=>{const txt=typeof s==='string'?s:(s.text||'');const u=typeof s==='object'?safeUrl(s.url||''):'';return `<div class="item"><div><div class="item-title">${esc(txt)}</div>${statusSub(txt)?`<div class="item-sub">${esc(statusSub(txt))}</div>`:''}</div>${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">↗</a>`:''}</div>`}).join('');document.getElementById('statusPanel').hidden=!statuses.length;
const lifes=[];if(d.gracePeriod)lifes.push(t('grace'));if(d.redemptionPeriod)lifes.push(t('redemption'));if(d.pendingDelete)lifes.push(t('pendingDelete'));if(d.hold)lifes.push(t('hold'));if(d.inactive)lifes.push(t('inactive'));document.getElementById('lifecycleList').innerHTML=lifes.map(x=>`<div class="life"><span>${esc(x)}</span><span>${esc(t('yes'))}</span></div>`).join('');document.getElementById('lifecyclePanel').hidden=!lifes.length;
const whois=d.whoisData||'',rdap=prettyRdap(d.rdapData||'');document.getElementById('whoisText').textContent=whois;document.getElementById('whoisRaw').hidden=!whois;document.getElementById('rdapText').textContent=rdap;document.getElementById('rdapRaw').hidden=!rdap}
async function copyText(btn,text){try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent=t('copied');setTimeout(()=>btn.textContent=old,1000)}catch{}}document.querySelectorAll('[data-rawcopy]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();copyText(btn,btn.dataset.rawcopy==='rdap'?document.getElementById('rdapText').textContent:document.getElementById('whoisText').textContent)});
async function load(){applyLang();if(!domain||!validDomain(domain)){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=t('invalid');return}try{const r=await fetch(API+encodeURIComponent(domain),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j||j.code!==0||!j.data)throw new Error(j?.msg||'Query failed');document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;render(j.data)}catch(err){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=`${t('failed')} ${err?.message||''}`}}document.getElementById('year').textContent=new Date().getFullYear();load();
</script></body></html>
