const THEME_NAMES={"en":["Theme","Graphite","Cloud","Linen","Moss","Ocean","Plum","Monochrome"],"zh":["外观","石墨深色","云白","亚麻暖色","苔绿","海洋蓝","鸢尾紫","极简黑白"],"de":["Design","Graphit","Wolkenweiß","Leinen","Moos","Ozean","Pflaume","Monochrom"],"fr":["Apparence","Graphite","Blanc nuage","Lin","Mousse","Océan","Prune","Monochrome"],"ja":["外観","グラファイト","クラウド","リネン","モス","オーシャン","プラム","モノクロ"],"es":["Apariencia","Grafito","Blanco nube","Lino","Musgo","Océano","Ciruela","Monocromo"]};
function translateThemes(){const names=THEME_NAMES[lang]||THEME_NAMES.en;const s=document.getElementById("themeSelect");const selected=s.value;["graphite","paper","sand","forest","ocean","plum","mono"].forEach((id,i)=>{const o=s.querySelector(`option[value="${id}"]`);if(o)o.textContent=names[i+1]});s.setAttribute("aria-label",names[0]);s.value=selected;}
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}let lang=detectLang(),currentData=null;const t=k=>({en:{domainInputLabel:'Domain name',rawWhois:"Raw WHOIS",rawRdap:"Raw RDAP"},zh:{domainInputLabel:'域名',rawWhois:"原始 WHOIS",rawRdap:"原始 RDAP"},de:{domainInputLabel:'Domainname',rawWhois:"WHOIS-Rohdaten",rawRdap:"RDAP-Rohdaten"},fr:{domainInputLabel:'Nom de domaine',rawWhois:"WHOIS brut",rawRdap:"RDAP brut"},ja:{domainInputLabel:'ドメイン名',rawWhois:"WHOIS 生データ",rawRdap:"RDAP 生データ"},es:{domainInputLabel:'Nombre de dominio',rawWhois:"WHOIS sin procesar",rawRdap:"RDAP sin procesar"}}[lang]?.[k]||LANGS[lang][k]||LANGS.en[k]||k);const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));const GROUP_TITLES={en:['Registration & Registrar','DNS & Domain Status'],zh:['注册与注册商','DNS 与域名状态'],de:['Registrierung & Registrar','DNS & Domainstatus'],fr:['Enregistrement & bureau','DNS & statut du domaine'],ja:['登録・レジストラ','DNS・ドメイン状態'],es:['Registro y registrador','DNS y estado del dominio']};function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;translateThemes();document.getElementById('domainInput').setAttribute('aria-label',t('domainInputLabel'));document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(v)el.textContent=v});document.querySelector('[data-i18n=identityGroup]').textContent=(GROUP_TITLES[lang]||GROUP_TITLES.en)[0];document.querySelector('[data-i18n=technicalGroup]').textContent=(GROUP_TITLES[lang]||GROUP_TITLES.en)[1];if(currentData)render(currentData)}sel.onchange=()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()};
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}function cleanDomain(v){v=(v||'').trim().toLowerCase();return v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0].replace(/:\d+$/,'').replace(/\.$/,'')}function validDomain(d){return d.length>2&&d.length<=253&&!/\s/.test(d)&&d.includes('.')&&!d.startsWith('.')&&!d.endsWith('.')}
let rawPath='';try{rawPath=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''))}catch{rawPath=''}const domain=cleanDomain(rawPath);document.getElementById('domainInput').value=domain;document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)};
function fmtDate(v){if(!v)return'';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v).replace('T',' ').replace(/Z$/,'');try{return new Intl.DateTimeFormat(lang==='zh'?'zh-CN':lang,{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}catch{return d.toISOString().slice(0,10)}}function humanDuration(s){
 if(!s)return '';
 const source=String(s).trim();
 const m=source.match(/^(?:(-?\d+)Y)?\s*(?:(-?\d+)Mo)?\s*(?:(-?\d+)D)?$/i);
 if(!m||!m.slice(1).some(v=>v!==undefined))return source;
 const vals=[m[1],m[2],m[3]];
 return vals.map((v,i)=>v!==undefined&&Number(v)!==0?`${Number(v)}${['Y','M','D'][i]}`:'').filter(Boolean).join(' ')||(vals.some(v=>v!==undefined)?'0D':source);
}function stateOf(d){if(d.reserved===true)return'reserved';if(d.unknown===true)return'unknown';if(d.registered===true)return'registered';if(d.registered===false)return'available';return'unknown'}function row(k,v,link=false){if(v===undefined||v===null||v==='')return'';const url=link?safeUrl(v):'';return `<div class="row"><div class="key">${esc(k)}</div><div class="value">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(v)} ↗</a>`:esc(v)}</div></div>`}function registrarRow(label,name,url){if(!name)return '';const href=safeUrl(url);const value=href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(name)}">${esc(name)} <span aria-hidden="true">↗</span></a>`:esc(name);return `<div class="row"><div class="key">${esc(label)}</div><div class="value">${value}</div></div>`}function setPanel(id,html){const el=document.getElementById(id);el.hidden=!html;if(html)el.querySelector('.panel-body').innerHTML=html}function metric(label,value,note=''){if(!value)return'';return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div>${note?`<div class="metric-note">${esc(note)}</div>`:''}</div>`}function prettyRdap(v){if(!v)return'';try{return JSON.stringify(JSON.parse(v),null,2)}catch{return v}}
const statusMap={'Client Transfer Prohibited':{zh:'禁止客户端转移',de:'Client-Transfer gesperrt',fr:'Transfert client interdit',ja:'クライアント転送禁止',es:'Transferencia de cliente prohibida'},'Client Update Prohibited':{zh:'禁止客户端更新',de:'Client-Update gesperrt',fr:'Mise à jour client interdite',ja:'クライアント更新禁止',es:'Actualización de cliente prohibida'},'Client Delete Prohibited':{zh:'禁止客户端删除',de:'Client-Löschung gesperrt',fr:'Suppression client interdite',ja:'クライアント削除禁止',es:'Eliminación de cliente prohibida'},'Active':{zh:'正常激活',de:'Aktiv',fr:'Actif',ja:'有効',es:'Activo'},'OK':{zh:'正常',de:'OK',fr:'OK',ja:'正常',es:'OK'}};const statusSub=txt=>lang==='en'?'':(statusMap[txt]?.[lang]||'');
function render(d){currentData=d;const displayDomain=d.domain||domain;document.title=`${displayDomain} | ${({en:'Domain Lookup',zh:'域名查询',de:'Domain-Abfrage',fr:'Recherche de domaine',ja:'ドメイン検索',es:'Consulta de dominios'}[lang])}`;document.getElementById('domainTitle').textContent=displayDomain;const state=stateOf(d),badge=document.getElementById('stateBadge');badge.className='badge '+state;badge.querySelector('span').textContent=t(state);const notice=document.getElementById('stateNotice');const nk=state==='reserved'?'reservedNotice':state==='available'?'availableNotice':state==='unknown'?'unknownNotice':'';notice.hidden=!nk;notice.innerHTML=nk?`<strong>${esc(t(state))}.</strong> ${esc(t(nk))}`:'';
let metrics='';metrics+=metric(t('domainAge'),humanDuration(d.createdAgo),d.creationDateISO8601||d.creationDate?`${t('created')}: ${fmtDate(d.creationDateISO8601||d.creationDate)}`:'');metrics+=metric(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate),d.expiresIn?`${t('expiresIn')}: ${humanDuration(d.expiresIn)}`:'');metrics+=metric(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate),d.updatedAgo?`${t('updatedAgo')}: ${humanDuration(d.updatedAgo)}`:'');metrics+=metric(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate),d.availableIn?`${t('availableIn')}: ${humanDuration(d.availableIn)}`:'');const me=document.getElementById('metrics');me.innerHTML=metrics;me.hidden=!metrics;
let reg='';reg+=row(t('created'),fmtDate(d.creationDateISO8601||d.creationDate));reg+=row(t('expires'),fmtDate(d.expirationDateISO8601||d.expirationDate));reg+=row(t('updated'),fmtDate(d.updatedDateISO8601||d.updatedDate));reg+=row(t('availableDate'),fmtDate(d.availableDateISO8601||d.availableDate));setPanel('registrationPanel',reg);
let rr='';rr+=registrarRow(t('registrar'),d.registrar,d.registrarURL);rr+=row(t('iana'),d.registrarIANAId);rr+=row(t('whoisServer'),d.registrarWHOISServer);rr+=row(t('rdapServer'),d.registrarRDAPServer,true);rr+=row(t('registryWebsite'),d.registryWebsite,true);rr+=row(t('registryWhois'),d.registryWHOISServer);rr+=row(t('registryRdap'),d.registryRDAPServer,true);setPanel('registrarPanel',rr);
let dns='';if(Array.isArray(d.nameServers)&&d.nameServers.length){dns+=`<div class="row"><div class="key">${esc(t('nameServers'))}</div><div class="value nameserver-values">${d.nameServers.map(ns=>`<div class="dns-item">${esc(ns)}</div>`).join('')}</div></div>`}if(d.dnssecSigned!==null&&d.dnssecSigned!==undefined)dns+=row(t('dnssec'),d.dnssecSigned?t('signed'):t('unsigned'));setPanel('dnsPanel',dns);
let statuses=Array.isArray(d.status)?d.status:[];if(!statuses.length&&state==='reserved')statuses=[{text:t('reserved'),url:''}];document.getElementById('statusList').innerHTML=statuses.map(s=>{const txt=typeof s==='string'?s:(s.text||'');const u=typeof s==='object'?safeUrl(s.url||''):'';return `<div class="item"><div><div class="item-title">${esc(txt)}</div>${statusSub(txt)?`<div class="item-sub">${esc(statusSub(txt))}</div>`:''}</div>${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(txt)}">↗</a>`:''}</div>`}).join('');document.getElementById('statusPanel').hidden=!statuses.length;
const lifes=[];if(d.gracePeriod)lifes.push(t('grace'));if(d.redemptionPeriod)lifes.push(t('redemption'));if(d.pendingDelete)lifes.push(t('pendingDelete'));if(d.hold)lifes.push(t('hold'));if(d.inactive)lifes.push(t('inactive'));document.getElementById('lifecycleList').innerHTML=lifes.map(x=>`<div class="life"><span>${esc(x)}</span><span>${esc(t('yes'))}</span></div>`).join('');document.getElementById('lifecyclePanel').hidden=!lifes.length;document.getElementById('identityGroup').hidden=document.getElementById('registrationPanel').hidden&&document.getElementById('registrarPanel').hidden;document.getElementById('technicalGroup').hidden=document.getElementById('dnsPanel').hidden&&document.getElementById('statusPanel').hidden&&document.getElementById('lifecyclePanel').hidden;
const whois=d.whoisData||'',rdap=prettyRdap(d.rdapData||'');document.getElementById('whoisText').textContent=whois;document.getElementById('whoisRaw').hidden=!whois;document.getElementById('rdapText').textContent=rdap;document.getElementById('rdapRaw').hidden=!rdap}
async function copyText(btn,text){try{await navigator.clipboard.writeText(text);const old=btn.textContent;btn.textContent=t('copied');setTimeout(()=>btn.textContent=old,1000)}catch{}}document.querySelectorAll('[data-rawcopy]').forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();copyText(btn,btn.dataset.rawcopy==='rdap'?document.getElementById('rdapText').textContent:document.getElementById('whoisText').textContent)});
async function load(){applyLang();if(!domain||!validDomain(domain)){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=t('invalid');return}try{const r=await fetch(API+encodeURIComponent(domain),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j||j.code!==0||!j.data)throw new Error(j?.msg||'Query failed');document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false;render(j.data)}catch(err){document.getElementById('loading').hidden=true;const e=document.getElementById('error');e.hidden=false;e.textContent=`${t('failed')} ${err?.message||''}`}}document.getElementById('year').textContent=new Date().getFullYear();load();

/* Theme selection persists across homepage and all domain paths */
(function(){const allowed=['graphite','paper','sand','forest','ocean','plum','mono'];let picked='paper';try{picked=localStorage.getItem('whoisTheme')||'paper'}catch(e){}if(!allowed.includes(picked))picked='paper';const element=document.getElementById('themeSelect');function setTheme(theme){document.documentElement.dataset.theme=theme;element.value=theme;try{localStorage.setItem('whoisTheme',theme)}catch(e){}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content={graphite:'#101318',paper:'#f5f6f4',sand:'#f5f1e9',forest:'#111a18',ocean:'#edf3f6',plum:'#f8f5f9',mono:'#ffffff'}[theme]}element.addEventListener('change',()=>setTheme(element.value));setTheme(picked)})();
