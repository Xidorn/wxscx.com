<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Domain Lookup | Mr Wang</title><meta name="robots" content="noindex,follow"><link rel="preconnect" href="https://api.mrwang.com" crossorigin><meta name="theme-color" content="#060914"><script src="/assets/theme-init.js"></script><link rel="stylesheet" href="/assets/themes.css"><link rel="stylesheet" href="/assets/result.css"></head><body>
<header class="topbar"><div class="top-inner"><a class="brand" href="/"><span class="brand-mark">W</span><span>WHOIS.MRWANG</span></a><div class="lang"><select id="themeSelect" class="theme-select" aria-label="Display theme"><option value="graphite">Graphite</option><option value="paper">Paper</option><option value="sand">Sand</option><option value="forest">Forest</option><option value="ocean">Ocean</option><option value="plum">Plum</option><option value="mono">Mono</option></select><select id="langSelect" aria-label="Language"></select></div></div></header>
<main class="wrap"><div class="search-strip"><form id="searchForm" class="quick"><input id="domainInput" placeholder="example.com" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="button" id="clearInput" class="clear-input" aria-label="Clear input" hidden><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button><button type="submit" id="searchSubmit" class="search-icon" aria-label="Search domain" title="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></form><details id="historyPanel" class="history-panel"><summary id="historySummary">Recent searches (0)</summary><div class="history-box"><div id="historyList"></div><div class="history-foot"><span id="historyNote"></span><button type="button" id="historyClear" class="history-clear">Clear all</button></div></div></details></div><div id="loading" class="loading" role="status" aria-live="polite"><div class="loading-inner"><span class="spinner" aria-hidden="true"></span><span class="loading-text" data-i18n="loading">Looking up domain information…</span></div><div class="loading-placeholder" aria-hidden="true"><span></span><span></span><span></span></div></div><div id="error" class="error" hidden></div><div id="content" hidden>
<section class="domain-head"><div class="domain-line"><h1 id="domainTitle" class="domain"></h1><div class="meta-line"><div id="stateBadge" class="badge"><span></span></div></div></div><div id="stateNotice" class="notice" hidden></div><div id="expiryNotice" class="expiry-notice" hidden></div></section>
<div id="metrics" class="metrics" hidden></div>
<div class="record-flow">
<section id="identityGroup" class="record-group" hidden>
  <div class="record-group-head"><h2 data-i18n="identityGroup">Registration & Registrar</h2><span>WHOIS / RDAP</span></div>
  <div id="registrationPanel" class="record-subgroup" hidden><h3 data-i18n="registration">Registration</h3><div class="panel-body rows"></div></div>
  <div id="registrarPanel" class="record-subgroup" hidden><h3 data-i18n="registrarInfo">Registrar & Registry</h3><div class="panel-body rows"></div></div>
</section>
<section id="technicalGroup" class="record-group" hidden>
  <div class="record-group-head"><h2 data-i18n="technicalGroup">DNS & Domain Status</h2><span>DNS / EPP</span></div>
  <div id="dnsPanel" class="record-subgroup" hidden><div class="panel-body"></div></div>
  <div id="statusPanel" class="record-subgroup" hidden><h3 data-i18n="status">Domain Status</h3><div id="statusList" class="items"></div></div>
  <div id="lifecyclePanel" class="record-subgroup lifecycle-subgroup" hidden><h3 data-i18n="lifecycle">Lifecycle</h3><div id="lifecycleList"></div></div>
</section>
</div>
<div class="raw"><details id="whoisRaw" hidden><summary data-i18n="rawWhois">Raw WHOIS</summary><div class="raw-tools"><button class="copy" data-rawcopy="whois" data-i18n="copy">Copy</button></div><pre id="whoisText" class="code"></pre></details><details id="rdapRaw" hidden><summary data-i18n="rawRdap">Raw RDAP</summary><div class="raw-tools"><button class="copy" data-rawcopy="rdap" data-i18n="copy">Copy</button></div><pre id="rdapText" class="code"></pre></details></div>
<footer class="foot">© <span id="year"></span> <a href="https://www.mrwang.com/" target="_blank" rel="noopener noreferrer" title="Mr Wang">Mr Wang</a></footer>
</div></main>
<script src="/assets/common.js" defer></script><script src="/assets/result.js" defer></script></body></html>
