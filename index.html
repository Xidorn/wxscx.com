<style>
:root,html[data-theme="paper"]{color-scheme:light;--bg:#f7f8fa;--sheet:#fff;--inner:#f5f7f9;--text:#202630;--mute:#73808f;--line:#e8ecf0;--accent:#315dc1;--accentText:#fff;--wash:#eff3fb;--status:#17805c;--shadow:0 16px 60px rgba(27,42,67,.045)}

html[data-theme="forest"]{color-scheme:dark;--bg:#111b18;--sheet:#1b2823;--inner:#23352d;--text:#edf2ec;--mute:#a3b8ac;--line:#364940;--accent:#b7d6ac;--accentText:#16231a;--wash:#283e32;--status:#b7d6ac;--shadow:0 16px 60px rgba(0,0,0,.14)}

html[data-theme="ocean"]{color-scheme:light;--bg:#edf3f6;--sheet:#fff;--inner:#f2f7fa;--text:#193442;--mute:#647c89;--line:#dce8ed;--accent:#12647e;--accentText:#fff;--wash:#e6f2f6;--status:#167354;--shadow:0 14px 48px rgba(11,60,82,.045)}

*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{background:var(--bg)}body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}a{color:var(--accent)}button,input,select{font:inherit}button,select{cursor:pointer}[hidden]{display:none!important}::selection{background:var(--wash);color:var(--text)}
.topbar{background:var(--sheet);border-bottom:1px solid var(--line)}.top-inner{max-width:1120px;margin:auto;padding:0 32px;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:inline-flex;align-items:center;gap:11px;color:var(--text);font-size:12px;font-weight:800;letter-spacing:.065em;text-decoration:none;white-space:nowrap}.brand-mark{width:31px;height:31px;border-radius:9px;background:var(--text);color:var(--sheet);display:grid;place-items:center;font-size:17px;letter-spacing:-.04em}.lang{display:flex;gap:8px;align-items:center}.lang select{height:36px;max-width:145px;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--inner);font-size:12px}.lang select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.foot{color:var(--mute);font-size:12px;text-align:center;padding:25px 16px}.foot span+span{margin-left:15px}
@media(max-width:650px){.top-inner{min-height:68px;padding:0 19px;gap:10px}.brand{font-size:11px}.brand-mark{width:28px;height:28px}.lang{gap:5px}.lang select{font-size:11px;padding:0 6px;max-width:100px}}

.page{min-height:100svh;display:flex;flex-direction:column}.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:35px 22px 85px}.hero-inner{width:min(660px,100%);text-align:center}.eyebrow{font:700 11px/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:.16em;color:var(--accent);margin-bottom:20px}.hero h1{font-size:clamp(37px,5vw,58px);line-height:1.12;letter-spacing:-.054em;font-weight:760;margin:0}.sub{max-width:510px;margin:20px auto 33px;color:var(--mute);line-height:1.75;font-size:15px}.lookup{display:flex;align-items:center;padding:6px;gap:6px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.lookup:focus-within{border-color:var(--accent)}.lookup input{height:56px;flex:1;min-width:0;padding:0 16px;border:0;background:transparent;outline:0;color:var(--text);font-size:17px}.lookup input::placeholder{color:var(--mute);opacity:.7}.lookup button{border:0;border-radius:9px;height:48px;min-width:114px;padding:0 22px;background:var(--accent);color:var(--accentText);font-size:13px;font-weight:720}.proof{display:flex;justify-content:center;gap:14px;margin-top:21px;color:var(--mute);font-size:11px;letter-spacing:.06em}.proof span+span:before{content:'·';margin-right:14px;opacity:.5}
@media(max-width:600px){.hero{padding:45px 18px 95px}.hero h1{font-size:40px}.sub{font-size:14px;margin:17px auto 27px}.lookup input{padding:0 10px;font-size:16px}.lookup button{min-width:83px;padding:0 12px}.proof{flex-wrap:wrap}}

.hero-inner{width:min(610px,100%)}.hero h1{font-weight:730}.sub{margin-bottom:29px}.proof{opacity:.7}.top-inner{max-width:970px;min-height:68px}
/* V17: Homepage and domain-result content share the same 880px reading column. */
.hero{padding:42px 30px 70px}
.hero-inner{width:min(880px,100%)}
.hero .eyebrow{margin-bottom:17px}
.hero h1{font-size:clamp(35px,4.7vw,54px);line-height:1.13}
.hero .sub{max-width:540px;margin:17px auto 32px;line-height:1.65}
.hero .lookup{width:100%;margin:0 auto}
.hero .proof{margin-top:19px}
.foot{padding:20px 16px 26px}
.foot a{color:inherit;text-decoration:none;font-weight:650;text-underline-offset:3px;transition:color .15s ease}
.foot a:hover,.foot a:focus-visible{color:var(--accent);text-decoration:underline}
@media(max-width:750px){.hero{padding:34px 13px 54px}.hero-inner{width:100%}.hero h1{font-size:clamp(32px,8vw,42px)}.hero .sub{max-width:420px;margin:15px auto 27px}.hero .lookup input{height:48px}.hero .lookup button{height:44px}}
@media(max-width:360px){.hero .lookup{padding:4px;gap:4px}.hero .lookup input{padding:0 9px}.hero .lookup button{min-width:78px;padding:0 9px}}

/* V18 unified search field & history */
.lookup,.search-strip .quick{display:flex;align-items:center;min-height:56px;gap:5px;position:relative}
.lookup input,.search-strip .quick input{align-self:center;min-width:0;line-height:normal;vertical-align:middle}
.lookup .search-icon,.search-strip .quick .search-icon{min-width:48px;width:48px;height:46px;padding:0;display:grid;place-items:center;flex:none;line-height:1}
.lookup .clear-input,.search-strip .quick .clear-input{flex:none;width:30px;min-width:30px;height:34px;padding:0;border:0;border-radius:7px;background:transparent;color:var(--mute);display:grid;place-items:center;box-shadow:none}
.lookup .clear-input:hover,.search-strip .quick .clear-input:hover{color:var(--text);background:var(--inner)}
.history-panel{width:100%;margin:12px 0 0;text-align:left;font-size:12px;color:var(--mute)}
.history-panel summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 2px;list-style:none;user-select:none;font-weight:600}
.history-panel summary::-webkit-details-marker{display:none}.history-panel summary:before{content:'↺';font-size:16px;font-weight:400;color:var(--accent)}
.history-panel[open] summary{margin-bottom:7px}
.history-box{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.history-row{display:flex;align-items:center;gap:8px;min-width:0;padding:0 10px}.history-row+.history-row{border-top:1px solid var(--line)}
.history-link{min-width:0;flex:1;display:block;text-decoration:none;color:var(--text);font-size:13px;font-weight:550;padding:12px 4px;overflow-wrap:anywhere}
.history-link:hover{color:var(--accent)}.history-remove,.history-clear{border:0;background:transparent;color:var(--mute);font:inherit;cursor:pointer}
.history-remove{padding:8px;flex:none;border-radius:6px}.history-remove:hover,.history-clear:hover{color:var(--text);background:var(--inner)}
.history-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-top:1px solid var(--line);font-size:11px;gap:10px}
.history-clear{font-weight:650;border-radius:5px;padding:5px 7px}
.history-empty{padding:16px 13px;color:var(--mute);font-size:12px}
@media(max-width:600px){.lookup .search-icon,.search-strip .quick .search-icon{width:43px;min-width:43px;height:40px}.lookup .clear-input,.search-strip .quick .clear-input{width:28px;min-width:28px}.lookup input,.search-strip .quick input{padding-left:9px;padding-right:3px}}
</style>
</head>
<body><div class="page">
<header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-mark">W</span><span>WHOIS.MRWANG</span></div><div class="lang"><select id="themeSelect" class="theme-select" aria-label="Display theme"><option value="graphite">Graphite</option><option value="paper">Paper</option><option value="sand">Sand</option><option value="forest">Forest</option><option value="ocean">Ocean</option><option value="plum">Plum</option><option value="mono">Mono</option></select><select id="langSelect" aria-label="Language"></select></div></div></header>
<main class="hero"><div class="hero-inner"><div class="eyebrow">WHOIS · RDAP</div><h1 data-i18n="title">WHOIS & RDAP Lookup</h1><p class="sub" data-i18n="desc">Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.</p><form id="searchForm" class="lookup"><input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name"><button type="button" id="clearInput" class="clear-input" aria-label="Clear input" hidden><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button><button type="submit" id="searchSubmit" class="search-icon" aria-label="Search domain" title="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></form><details id="historyPanel" class="history-panel"><summary id="historySummary">Recent searches (0)</summary><div class="history-box"><div id="historyList"></div><div class="history-foot"><span id="historyNote"></span><button type="button" id="historyClear" class="history-clear">Clear all</button></div></div></details><div class="proof"><span>WHOIS</span><span>RDAP</span><span>DNS</span></div></div></main>
<footer class="foot">© <span id="year"></span> <a href="https://www.mrwang.com/" target="_blank" rel="noopener noreferrer" title="Mr Wang">Mr Wang</a></footer>
</div>
<script>
const LANGS={en:{name:'English',title:'Domain Lookup',desc:'Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.',search:'Search',worldwide:'Worldwide TLD support'},zh:{name:'简体中文',title:'域名 WHOIS 查询',desc:'查询全球域名的 WHOIS、RDAP、注册商、DNS 与生命周期信息。',search:'查询',worldwide:'支持全球域名后缀'},de:{name:'Deutsch',title:'Domain-Abfrage',desc:'WHOIS-, RDAP-, Registrar-, DNS- und Lifecycle-Daten weltweit durchsuchen.',search:'Suchen',worldwide:'Globale TLD-Unterstützung'},fr:{name:'Français',title:'Recherche de domaine',desc:'Recherchez les données WHOIS, RDAP, registrar, DNS et cycle de vie.',search:'Rechercher',worldwide:'Prise en charge mondiale des TLD'},ja:{name:'日本語',title:'ドメイン検索',desc:'世界中のドメインの WHOIS、RDAP、レジストラ、DNS、ライフサイクル情報を検索。',search:'検索',worldwide:'世界中のTLDに対応'},es:{name:'Español',title:'Consulta de dominios',desc:'Consulta WHOIS, RDAP, registrador, DNS y ciclo de vida de dominios.',search:'Buscar',worldwide:'Compatibilidad global con TLD'}};
const THEME_NAMES={"en":["Theme","Graphite","Cloud","Linen","Moss","Ocean","Plum","Monochrome"],"zh":["外观","石墨深色","云白","亚麻暖色","苔绿","海洋蓝","鸢尾紫","极简黑白"],"de":["Design","Graphit","Wolkenweiß","Leinen","Moos","Ozean","Pflaume","Monochrom"],"fr":["Apparence","Graphite","Blanc nuage","Lin","Mousse","Océan","Prune","Monochrome"],"ja":["外観","グラファイト","クラウド","リネン","モス","オーシャン","プラム","モノクロ"],"es":["Apariencia","Grafito","Blanco nube","Lino","Musgo","Océano","Ciruela","Monocromo"]};
function translateThemes(){const names=THEME_NAMES[lang]||THEME_NAMES.en;const s=document.getElementById("themeSelect");const selected=s.value;["graphite","paper","sand","forest","ocean","plum","mono"].forEach((id,i)=>{const o=s.querySelector(`option[value="${id}"]`);if(o)o.textContent=names[i+1]});s.setAttribute("aria-label",names[0]);s.value=selected;}
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;translateThemes();document.getElementById('domainInput').setAttribute('aria-label',({en:'Domain name',zh:'域名',de:'Domainname',fr:'Nom de domaine',ja:'ドメイン名',es:'Nombre de dominio'}[lang]));document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}sel.onchange=()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()};applyLang();function cleanDomain(v){v=(v||'').trim().toLowerCase();return v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0].replace(/:\d+$/,'').replace(/\.$/,'')}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)};document.getElementById('year').textContent=new Date().getFullYear();

/* Theme selection persists across homepage and all domain paths */
(function(){const allowed=['graphite','paper','sand','forest','ocean','plum','mono'];let picked='paper';try{picked=localStorage.getItem('whoisTheme')||'paper'}catch(e){}if(!allowed.includes(picked))picked='paper';const element=document.getElementById('themeSelect');function setTheme(theme){document.documentElement.dataset.theme=theme;element.value=theme;try{localStorage.setItem('whoisTheme',theme)}catch(e){}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content={graphite:'#101318',paper:'#f5f6f4',sand:'#f5f1e9',forest:'#111a18',ocean:'#edf3f6',plum:'#f8f5f9',mono:'#ffffff'}[theme]}element.addEventListener('change',()=>setTheme(element.value));setTheme(picked)})();

/* One-year, browser-only WHOIS query history. Cookie is shared by index and 404 routes. */
const HISTORY_COOKIE='mrwang_whois_history';
const HISTORY_TEXT={
 en:{history:'Recent searches',clear:'Clear all',remove:'Remove',empty:'No recent searches',saved:'Stored on this browser for up to one year',clearInput:'Clear input',searchIcon:'Search domain'},
 zh:{history:'查询历史',clear:'清空记录',remove:'删除',empty:'暂无查询记录',saved:'浏览器保存，最长一年',clearInput:'清空输入',searchIcon:'搜索域名'},
 de:{history:'Letzte Suchen',clear:'Alle löschen',remove:'Entfernen',empty:'Noch keine Suchanfragen',saved:'Bis zu einem Jahr in diesem Browser gespeichert',clearInput:'Eingabe löschen',searchIcon:'Domain suchen'},
 fr:{history:'Recherches récentes',clear:'Tout effacer',remove:'Supprimer',empty:'Aucune recherche récente',saved:'Conservé sur ce navigateur pendant un an maximum',clearInput:'Effacer la saisie',searchIcon:'Rechercher un domaine'},
 ja:{history:'検索履歴',clear:'すべて削除',remove:'削除',empty:'検索履歴はありません',saved:'このブラウザーに最長1年間保存',clearInput:'入力を消去',searchIcon:'ドメインを検索'},
 es:{history:'Búsquedas recientes',clear:'Borrar todo',remove:'Eliminar',empty:'No hay búsquedas recientes',saved:'Guardado en este navegador hasta un año',clearInput:'Borrar texto',searchIcon:'Buscar dominio'}
};
function htxt(k){return (HISTORY_TEXT[lang]||HISTORY_TEXT.en)[k]}
function readHistory(){try{const part=document.cookie.split('; ').find(c=>c.startsWith(HISTORY_COOKIE+'='));if(!part)return[];const obj=JSON.parse(decodeURIComponent(part.slice(HISTORY_COOKIE.length+1)));return Array.isArray(obj)?obj.filter(x=>typeof x==='string'&&x.length<254).slice(0,10):[]}catch{return[]}}
function writeHistory(items){let list=items.slice(0,10);let val=encodeURIComponent(JSON.stringify(list));while(val.length>3000&&list.length){list.pop();val=encodeURIComponent(JSON.stringify(list))}document.cookie=HISTORY_COOKIE+'='+val+'; Max-Age=31536000; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');renderHistory()}
function rememberDomain(v){const d=cleanDomain(v);if(!d||d.length>253||!d.includes('.')||/\s/.test(d))return;writeHistory([d,...readHistory().filter(x=>x!==d)])}
function renderHistory(){const panel=document.getElementById('historyPanel');if(!panel)return;const arr=readHistory();const title=document.getElementById('historySummary');title.textContent=htxt('history')+' ('+arr.length+')';const list=document.getElementById('historyList');list.replaceChildren();if(!arr.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent=htxt('empty');list.append(empty)}else arr.forEach(d=>{const row=document.createElement('div');row.className='history-row';const a=document.createElement('a');a.className='history-link';a.textContent=d;a.href='/'+encodeURIComponent(d);const del=document.createElement('button');del.type='button';del.className='history-remove';del.textContent='×';del.title=htxt('remove');del.setAttribute('aria-label',htxt('remove')+' '+d);del.addEventListener('click',()=>writeHistory(readHistory().filter(x=>x!==d)));row.append(a,del);list.append(row)});document.getElementById('historyNote').textContent=htxt('saved');const all=document.getElementById('historyClear');all.textContent=htxt('clear');all.hidden=!arr.length}
function updateSearchControls(){const input=document.getElementById('domainInput');const btn=document.getElementById('clearInput');btn.hidden=!input.value;btn.title=htxt('clearInput');btn.setAttribute('aria-label',htxt('clearInput'));const submit=document.getElementById('searchSubmit');submit.title=htxt('searchIcon');submit.setAttribute('aria-label',htxt('searchIcon'));renderHistory()}
(function setupQueryTools(){const input=document.getElementById('domainInput');const clr=document.getElementById('clearInput');clr.onclick=()=>{input.value='';input.focus();updateSearchControls()};input.addEventListener('input',updateSearchControls);document.getElementById('historyClear').onclick=()=>writeHistory([]);document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=cleanDomain(input.value);if(!d)return;rememberDomain(d);location.href='/'+encodeURIComponent(d)};sel.addEventListener('change',updateSearchControls);updateSearchControls()})();
</script></body></html>
