<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHOIS Lookup — Mr Wang</title>
  <meta name="description" content="Fast WHOIS and domain registration lookup. Check domain age, registrar, creation date, expiration date, nameservers and registration status.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://whois.mrwang.com/">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="home-page">
  <main class="home-shell">
    <section class="home-card" aria-labelledby="page-title">
      <a class="brand" href="/" aria-label="WHOIS Home">WHOIS<span>.</span></a>
      <h1 id="page-title">WHOIS Lookup</h1>
      <p class="home-subtitle">Check registration details, domain age, expiration date, registrar and nameservers.</p>

      <form class="search-form" id="lookup-form" novalidate>
        <label class="sr-only" for="domain-input">Domain name</label>
        <div class="search-box">
          <input id="domain-input" name="domain" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="example.com" aria-label="Enter a domain name">
          <button type="submit">Lookup</button>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </form>

      <p class="home-note">Enter a domain only, for example <button type="button" class="text-button" data-domain="wangxiansheng.com">wangxiansheng.com</button>.</p>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
