<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Record | Mr Wang</title>
<meta name="description" content="Domain Record for WHOIS, RDAP, registrar, DNS, expiration and lifecycle information.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://whois.mrwang.com/"><meta name="theme-color" content="#f3f0e8">
<style>
:root{--paper:#f3f0e8;--ink:#111214;--muted:#706c64;--line:#cfc9bd;--blue:#2758ff;--white:#fffdf8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(rgba(17,18,20,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(17,18,20,.028) 1px,transparent 1px),var(--paper);background-size:32px 32px;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px max(22px,calc((100vw - 1240px)/2));border-bottom:1px solid var(--line)}.brand{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.brand:before{content:"●";color:var(--blue);margin-right:9px;font-size:9px;vertical-align:2px}.lang{border-left:1px solid var(--line);padding-left:16px}.lang select{border:0;background:transparent;height:34px;font-size:12px;font-weight:700;outline:0;color:var(--ink)}
.main{width:min(1240px,calc(100% - 44px));margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.75fr);gap:90px;align-items:center;padding:70px 0}.intro{align-self:center}.eyebrow{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;margin-bottom:22px}.intro h1{font-size:clamp(68px,10vw,132px);line-height:.82;letter-spacing:-.075em;margin:0;font-weight:820}.intro p{max-width:560px;margin:28px 0 0;font-size:15px;line-height:1.75;color:var(--muted)}.query{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:22px 0}.query-label{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}.search{display:grid;grid-template-columns:1fr auto;align-items:end;gap:14px}.search input{width:100%;height:58px;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--ink);padding:0}.search input::placeholder{color:#aaa398}.search button{height:44px;border:0;background:var(--blue);color:#fff;padding:0 19px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6}.micro{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;border-top:1px solid var(--line)}.micro span{padding:13px 0;font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.08em}.foot{width:min(1240px,calc(100% - 44px));margin:0 auto;padding:18px 0 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.foot:after{content:"WHOIS / RDAP / DNS";font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}
@media(max-width:880px){.main{grid-template-columns:1fr;gap:54px;padding:54px 0}.intro h1{font-size:78px}.query{max-width:none}}@media(max-width:560px){.top{padding:14px 16px}.brand{font-size:11px}.main,.foot{width:calc(100% - 28px)}.main{padding:42px 0;gap:38px}.intro h1{font-size:58px}.intro p{font-size:14px}.search{grid-template-columns:1fr}.search button{width:100%}.micro{grid-template-columns:1fr}.foot:after{display:none}}
</style>
</head>
<body><div class="shell">
<header class="top"><div class="brand">Domain Record · Mr Wang</div><div class="lang"><select id="langSelect" aria-label="Language"></select></div></header>
<main class="main"><section class="intro"><div class="eyebrow" data-i18n="kicker">Domain intelligence</div><h1 data-i18n="title">Domain Record</h1><p data-i18n="desc">A structured view of WHOIS, RDAP, registrar, DNS and lifecycle data.</p></section><section class="query"><div class="query-label" data-i18n="queryLabel">Lookup record</div><form id="searchForm" class="search"><input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name"><button type="submit" data-i18n="search">Search</button></form><div class="hint" data-i18n="hint">Enter a domain name only — no protocol or path.</div><div class="micro"><span>WHOIS</span><span>RDAP</span><span>DNS / DNSSEC</span></div></section></main>
<footer class="foot"><span>© <span id="year"></span> Mr Wang</span></footer></div>
<script>
const LANGS={
 en:{name:'English',kicker:'Domain intelligence',title:'Domain Record',desc:'A structured view of WHOIS, RDAP, registrar, DNS and lifecycle data.',queryLabel:'Lookup record',search:'Search',hint:'Enter a domain name only — no protocol or path.'},
 zh:{name:'简体中文',kicker:'域名信息档案',title:'域名档案',desc:'以结构化方式查看 WHOIS、RDAP、注册商、DNS 与域名生命周期数据。',queryLabel:'查询域名',search:'查询',hint:'仅输入域名，不要包含协议、端口或路径。'},
 de:{name:'Deutsch',kicker:'Domain-Dossier',title:'Domain Record',desc:'WHOIS-, RDAP-, Registrar-, DNS- und Lifecycle-Daten in einer strukturierten Ansicht.',queryLabel:'Domain abfragen',search:'Suchen',hint:'Nur den Domainnamen eingeben – ohne Protokoll oder Pfad.'},
 fr:{name:'Français',kicker:'Dossier de domaine',title:'Domain Record',desc:'Une vue structurée des données WHOIS, RDAP, registrar, DNS et cycle de vie.',queryLabel:'Rechercher un domaine',search:'Rechercher',hint:'Saisissez uniquement le nom de domaine, sans protocole ni chemin.'},
 ja:{name:'日本語',kicker:'ドメイン記録',title:'Domain Record',desc:'WHOIS、RDAP、レジストラ、DNS、ライフサイクル情報を構造化して表示します。',queryLabel:'ドメインを検索',search:'検索',hint:'プロトコルやパスを含めず、ドメイン名のみ入力してください。'},
 es:{name:'Español',kicker:'Expediente de dominio',title:'Domain Record',desc:'Una vista estructurada de WHOIS, RDAP, registrador, DNS y ciclo de vida.',queryLabel:'Consultar dominio',search:'Buscar',hint:'Introduce solo el dominio, sin protocolo ni ruta.'}
};
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}
let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}sel.addEventListener('change',()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()});applyLang();function cleanDomain(v){v=(v||'').trim().toLowerCase();v=v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0].replace(/:\d+$/,'').replace(/\.$/,'');return v}document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)});document.getElementById('year').textContent=new Date().getFullYear();
</script></body></html>
