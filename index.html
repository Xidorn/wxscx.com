<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WHOIS Lookup | Mr Wang</title>
  <meta name="description" content="WHOIS lookup for domain registration, registrar, expiration, nameservers, DNSSEC and domain status.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://whois.mrwang.com/">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{--bg:#f6f7f9;--surface:#fff;--text:#111318;--muted:#69707d;--line:#e4e7ec;--line2:#eef0f3;--accent:#2563eb;--shadow:0 18px 55px rgba(15,23,42,.055)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:70px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));gap:18px}.brand{font-weight:780;letter-spacing:-.025em;font-size:17px;white-space:nowrap}.lang{border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px}.lang select{height:38px;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.hero{flex:1;display:grid;place-items:center;padding:72px 22px}.inner{width:min(820px,100%);text-align:center}.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:#8a919e}.inner h1{font-size:clamp(48px,7.5vw,78px);line-height:.98;letter-spacing:-.06em;margin:18px 0 18px}.desc{font-size:17px;line-height:1.75;color:var(--muted);max-width:630px;margin:0 auto}.search{display:flex;align-items:center;gap:8px;margin:34px auto 0;padding:7px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);max-width:720px;text-align:left}.search input{flex:1;min-width:0;height:54px;padding:0 14px;border:0;outline:0;background:transparent;font-size:17px;color:var(--text)}.search input::placeholder{color:#a3a9b3}.search button{height:50px;border:0;border-radius:10px;background:#15181e;color:#fff;padding:0 24px;font-weight:720;cursor:pointer}.search button:hover{background:#000}.hint{font-size:12px;color:#9aa0aa;margin-top:14px}.footer{padding:20px 22px 28px;text-align:center;color:#a0a6b0;font-size:12px}@media(max-width:640px){.top{height:62px;padding:0 16px}.hero{padding:52px 16px}.inner h1{font-size:48px}.desc{font-size:15px}.search{display:grid}.search button{width:100%;height:48px}.search input{height:50px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">WHOIS · Mr Wang</div><div class="lang"><select id="langSelect" aria-label="Language"></select></div></header>
  <main class="hero">
    <div class="inner">
      <div class="kicker" data-i18n="kicker">Domain information</div>
      <h1 data-i18n="title">WHOIS Lookup</h1>
      <p class="desc" data-i18n="desc">Check registration, registrar, expiration, nameservers, DNSSEC and domain status from one clean result.</p>
      <form id="searchForm" class="search">
        <input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name">
        <button type="submit" data-i18n="search">Search</button>
      </form>
      <div class="hint" data-i18n="hint">Enter a domain name only — no protocol or path.</div>
    </div>
  </main>
  <footer class="footer">© <span id="year"></span> Mr Wang</footer>
</div>
<script>
const LANGS={
 en:{name:'English',kicker:'Domain information',title:'WHOIS Lookup',desc:'Check registration, registrar, expiration, nameservers, DNSSEC and domain status from one clean result.',search:'Search',hint:'Enter a domain name only — no protocol or path.'},
 zh:{name:'简体中文',kicker:'域名信息查询',title:'WHOIS 查询',desc:'集中查询域名注册信息、注册商、到期时间、域名服务器、DNSSEC 与当前状态。',search:'查询',hint:'仅输入域名，不要包含协议、端口或路径。'},
 de:{name:'Deutsch',kicker:'Domaininformationen',title:'WHOIS-Abfrage',desc:'Registrierung, Registrar, Ablaufdatum, Nameserver, DNSSEC und Domainstatus übersichtlich prüfen.',search:'Suchen',hint:'Nur den Domainnamen eingeben – ohne Protokoll oder Pfad.'},
 fr:{name:'Français',kicker:'Informations du domaine',title:'Recherche WHOIS',desc:'Consultez l’enregistrement, le registrar, l’expiration, les serveurs de noms, DNSSEC et le statut du domaine.',search:'Rechercher',hint:'Saisissez uniquement le nom de domaine, sans protocole ni chemin.'},
 ja:{name:'日本語',kicker:'ドメイン情報',title:'WHOIS検索',desc:'登録情報、レジストラ、有効期限、ネームサーバー、DNSSEC、ドメイン状態をまとめて確認できます。',search:'検索',hint:'プロトコルやパスを含めず、ドメイン名のみ入力してください。'},
 es:{name:'Español',kicker:'Información del dominio',title:'Consulta WHOIS',desc:'Consulta registro, registrador, vencimiento, servidores DNS, DNSSEC y estado del dominio.',search:'Buscar',hint:'Introduce solo el dominio, sin protocolo ni ruta.'}
};
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}
let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}
sel.addEventListener('change',()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()});applyLang();
function cleanDomain(v){v=(v||'').trim().toLowerCase();v=v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0];v=v.replace(/:\d+$/,'').replace(/\.$/,'');return v}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)});
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
