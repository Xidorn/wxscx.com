<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Domain Lookup | Mr Wang</title>
<meta name="description" content="Global domain lookup for WHOIS, RDAP, registrar, DNS, registration, expiration and lifecycle information.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://whois.mrwang.com/">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#fff;--soft:#f7f8fa;--ink:#15171a;--muted:#7a8088;--line:#e7e9ee;--blue:#2f6fed;--blue2:#1f5ed7;--chip:#f1f5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.page{min-height:100vh;display:flex;flex-direction:column}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;width:min(1180px,calc(100% - 40px));margin:0 auto}.brand{font-size:13px;font-weight:760;letter-spacing:.04em;color:var(--ink)}.brand b{color:var(--blue)}.lang select{border:0;background:transparent;color:#5f6670;font-size:13px;outline:none;cursor:pointer}.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 20px 120px}.hero-inner{width:min(820px,100%);text-align:center}.mark{width:42px;height:42px;border-radius:13px;margin:0 auto 24px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em;box-shadow:0 8px 25px rgba(17,24,39,.08)}h1{font-size:clamp(42px,6vw,68px);line-height:1.02;letter-spacing:-.055em;margin:0;font-weight:780}.sub{max-width:620px;margin:18px auto 34px;color:var(--muted);font-size:15px;line-height:1.7}.search-shell{width:100%;padding:9px;border:1px solid #dfe3e8;border-radius:18px;background:#fff;box-shadow:0 18px 55px rgba(31,41,55,.08)}.search{display:grid;grid-template-columns:1fr auto;gap:8px}.search input{height:58px;border:0;outline:0;padding:0 18px;font-size:18px;color:var(--ink);min-width:0}.search input::placeholder{color:#b2b7be}.search button{height:58px;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:0 26px;font-weight:700;cursor:pointer;transition:.18s}.search button:hover{background:var(--blue2);transform:translateY(-1px)}.helper{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:18px;color:#90959d;font-size:12px}.helper span:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#c9ced5;margin-right:8px;vertical-align:1px}.foot{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#9aa0a8;font-size:12px}.foot span{padding:0 16px}.foot span+span{border-left:1px solid var(--line)}
@media(max-width:600px){.nav{width:calc(100% - 28px);height:58px}.hero{padding:52px 14px 90px}.mark{margin-bottom:20px}h1{font-size:42px}.sub{font-size:14px;margin-bottom:26px}.search-shell{padding:7px;border-radius:15px}.search{grid-template-columns:1fr}.search input{height:54px;font-size:16px}.search button{height:50px}.helper{gap:10px 16px}.foot{flex-wrap:wrap;height:auto;padding:18px 0;gap:8px}.foot span+span{border-left:0}}
</style></head>
<body><div class="page">
<header class="nav"><div class="brand">WHOIS<b>.</b>MRWANG</div><div class="lang"><select id="langSelect" aria-label="Language"></select></div></header>
<main class="hero"><div class="hero-inner"><div class="mark">W</div><h1 data-i18n="title">Global Domain Lookup</h1><p class="sub" data-i18n="desc">Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.</p><div class="search-shell"><form id="searchForm" class="search"><input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name"><button type="submit" data-i18n="search">Search</button></form></div><div class="helper"><span>WHOIS</span><span>RDAP</span><span>DNS</span><span data-i18n="worldwide">Worldwide TLD support</span></div></div></main>
<footer class="foot"><span>© <span id="year"></span> Mr Wang</span><span>whois.mrwang.com</span></footer>
</div>
<script>
const LANGS={en:{name:'English',title:'Global Domain Lookup',desc:'Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.',search:'Search',worldwide:'Worldwide TLD support'},zh:{name:'简体中文',title:'全球域名查询',desc:'查询全球域名的 WHOIS、RDAP、注册商、DNS 与生命周期信息。',search:'查询',worldwide:'支持全球域名后缀'},de:{name:'Deutsch',title:'Globale Domain-Suche',desc:'WHOIS-, RDAP-, Registrar-, DNS- und Lifecycle-Daten weltweit durchsuchen.',search:'Suchen',worldwide:'Globale TLD-Unterstützung'},fr:{name:'Français',title:'Recherche mondiale de domaines',desc:'Recherchez les données WHOIS, RDAP, registrar, DNS et cycle de vie.',search:'Rechercher',worldwide:'Prise en charge mondiale des TLD'},ja:{name:'日本語',title:'グローバルドメイン検索',desc:'世界中のドメインの WHOIS、RDAP、レジストラ、DNS、ライフサイクル情報を検索。',search:'検索',worldwide:'世界中のTLDに対応'},es:{name:'Español',title:'Búsqueda global de dominios',desc:'Consulta WHOIS, RDAP, registrador, DNS y ciclo de vida de dominios.',search:'Buscar',worldwide:'Compatibilidad global con TLD'}};
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}sel.onchange=()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()};applyLang();function cleanDomain(v){v=(v||'').trim().toLowerCase();return v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0].replace(/:\d+$/,'').replace(/\.$/,'')}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)};document.getElementById('year').textContent=new Date().getFullYear();
</script></body></html>
