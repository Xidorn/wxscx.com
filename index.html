<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Domain Intelligence | Mr Wang</title>
  <meta name="description" content="Domain Intelligence for WHOIS, RDAP, registrar, DNS, expiration and lifecycle information.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://whois.mrwang.com/">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{--bg:#eef1f5;--text:#15171b;--muted:#707783;--line:rgba(30,34,40,.08);--accent:#2f6fed;--shadow:0 28px 80px rgba(20,28,42,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;background:radial-gradient(circle at 16% 8%,rgba(255,255,255,.98) 0,rgba(255,255,255,0) 31%),radial-gradient(circle at 84% 14%,rgba(206,217,238,.62) 0,rgba(206,217,238,0) 28%),linear-gradient(180deg,#f7f9fb 0%,#eef1f5 52%,#f6f7f9 100%)}
    button,input,select{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column}.top{width:min(1180px,calc(100% - 32px));height:62px;margin:12px auto 0;padding:0 12px 0 18px;background:rgba(255,255,255,.66);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%);border:1px solid rgba(255,255,255,.8);box-shadow:0 14px 42px rgba(29,36,50,.075),inset 0 0 0 1px rgba(31,35,40,.035);border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:760;letter-spacing:-.025em;font-size:15px;white-space:nowrap}.lang{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.64);padding:0 8px}.lang select{height:38px;border:0;outline:0;background:transparent;color:var(--text);font-size:12.5px}
    .hero{flex:1;display:grid;place-items:center;padding:84px 22px 70px}.inner{width:min(860px,100%);text-align:center}.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:780;color:#9299a4}.inner h1{font-size:clamp(54px,8vw,88px);line-height:.94;letter-spacing:-.065em;margin:18px 0 20px;font-weight:760}.desc{font-size:16px;line-height:1.75;color:var(--muted);max-width:640px;margin:0 auto}
    .search-shell{max-width:760px;margin:38px auto 0;padding:7px;background:rgba(255,255,255,.67);backdrop-filter:blur(30px) saturate(145%);-webkit-backdrop-filter:blur(30px) saturate(145%);border:1px solid rgba(255,255,255,.82);border-radius:20px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(26,30,36,.035)}
    .search{display:flex;align-items:center;gap:8px;text-align:left}.search input{flex:1;min-width:0;height:58px;padding:0 16px;border:0;outline:0;background:transparent;font-size:17px;color:var(--text)}.search input::placeholder{color:#9ba2ac}.search button{height:50px;border:0;border-radius:13px;background:#202329;color:#fff;padding:0 24px;font-weight:700;cursor:pointer;box-shadow:0 5px 14px rgba(17,24,39,.13)}.search button:hover{background:#111317}.hint{font-size:11.5px;color:#979ea8;margin-top:15px}.footer{padding:20px 22px 30px;text-align:center;color:#9da4ae;font-size:11.5px}
    @media(max-width:640px){.top{width:calc(100% - 16px);height:58px;margin-top:8px;padding:0 10px 0 14px;border-radius:16px}.hero{padding:58px 14px}.inner h1{font-size:50px}.desc{font-size:14.5px}.search-shell{border-radius:18px}.search{display:grid}.search button{width:100%;height:48px}.search input{height:52px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand">Domain Intelligence · Mr Wang</div><div class="lang"><select id="langSelect" aria-label="Language"></select></div></header>
  <main class="hero">
    <div class="inner">
      <div class="kicker" data-i18n="kicker">Domain information</div>
      <h1 data-i18n="title">Domain Intelligence</h1>
      <p class="desc" data-i18n="desc">WHOIS, RDAP, registrar, DNS and lifecycle data in one focused view.</p>
      <div class="search-shell"><form id="searchForm" class="search">
        <input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name">
        <button type="submit" data-i18n="search">Search</button>
      </form></div>
      <div class="hint" data-i18n="hint">Enter a domain name only — no protocol or path.</div>
    </div>
  </main>
  <footer class="footer">© <span id="year"></span> Mr Wang</footer>
</div>
<script>
const LANGS={
 en:{name:'English',kicker:'Domain information',title:'Domain Intelligence',desc:'WHOIS, RDAP, registrar, DNS and lifecycle data in one focused view.',search:'Search',hint:'Enter a domain name only — no protocol or path.'},
 zh:{name:'简体中文',kicker:'域名信息查询',title:'域名情报查询',desc:'集中查看 WHOIS、RDAP、注册商、DNS、到期时间与域名生命周期信息。',search:'查询',hint:'仅输入域名，不要包含协议、端口或路径。'},
 de:{name:'Deutsch',kicker:'Domaininformationen',title:'WHOIS-Abfrage',desc:'Registrierung, Registrar, Ablaufdatum, Nameserver, DNSSEC und Domainstatus übersichtlich prüfen.',search:'Suchen',hint:'Nur den Domainnamen eingeben – ohne Protokoll oder Pfad.'},
 fr:{name:'Français',kicker:'Informations du domaine',title:'Recherche WHOIS',desc:'Consultez l’enregistrement, le registrar, l’expiration, les serveurs de noms, DNSSEC et le statut du domaine.',search:'Rechercher',hint:'Saisissez uniquement le nom de domaine, sans protocole ni chemin.'},
 ja:{name:'日本語',kicker:'ドメイン情報',title:'WHOIS検索',desc:'登録情報、レジストラ、有効期限、ネームサーバー、DNSSEC、ドメイン状態をまとめて確認できます。',search:'検索',hint:'プロトコルやパスを含めず、ドメイン名のみ入力してください。'},
 es:{name:'Español',kicker:'Información del dominio',title:'Consulta WHOIS',desc:'Consulta registro, registrador, vencimiento, servidores DNS, DNSSEC y estado del dominio.',search:'Buscar',hint:'Introduce solo el dominio, sin protocolo ni ruta.'}
};
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}
let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}
sel.addEventListener('change',()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()});applyLang();
function cleanDomain(v){v=(v||'').trim().toLowerCase();v=v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0];v=v.replace(/:\d+$/,'').replace(/\.$/,'');return v}
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)});
document.getElementById('year').textContent=new Date().getFullYear();
</script>
</body>
</html>
