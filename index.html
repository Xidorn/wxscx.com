<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHOIS & RDAP Lookup | Mr Wang</title>
<meta name="description" content="Global WHOIS and RDAP domain lookup for registrar, DNS, registration, expiration and lifecycle information.">
<meta name="robots" content="index,follow"><link rel="canonical" href="https://whois.mrwang.com/">
<meta name="theme-color" content="#060914">
<style>
:root,html[data-theme="paper"]{color-scheme:light;--bg:#f5f6f5;--sheet:#ffffff;--inner:#f8f9f8;--text:#202a30;--mute:#728088;--line:#e4e9e8;--accent:#346b79;--accentText:#fff;--wash:#e9f0ef;--status:#26815b}
html[data-theme="graphite"]{color-scheme:dark;--bg:#15191d;--sheet:#20262b;--inner:#242c32;--text:#eef2f2;--mute:#a0acb0;--line:#39434a;--accent:#a2c9ca;--accentText:#101a1c;--wash:#29383b;--status:#80d8aa}
html[data-theme="sand"]{color-scheme:light;--bg:#f6f2eb;--sheet:#fffdf9;--inner:#faf6ef;--text:#35332f;--mute:#82796d;--line:#e9e1d6;--accent:#9c6748;--accentText:#fff;--wash:#f1e7d9;--status:#61804c}
html[data-theme="forest"]{color-scheme:dark;--bg:#15201c;--sheet:#1d2b25;--inner:#25352c;--text:#eaf1e8;--mute:#a9b8ac;--line:#3c5143;--accent:#bbd8ad;--accentText:#18251c;--wash:#2e4134;--status:#b8df8e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{background:var(--bg)}body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,select{cursor:pointer}a{color:var(--accent)}[hidden]{display:none!important}
.topbar{border-bottom:1px solid var(--line)}.top-inner{max-width:1080px;margin:auto;padding:0 28px;min-height:78px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;gap:10px;align-items:center;color:var(--text);text-decoration:none;font-size:13px;letter-spacing:.035em;font-weight:780;white-space:nowrap}.brand-mark{width:29px;height:29px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:800}.lang{display:flex;gap:9px;align-items:center}.lang select{border:1px solid var(--line);background:var(--sheet);color:var(--text);border-radius:9px;height:36px;padding:0 9px;font-size:12px;max-width:150px;min-width:0}.lang select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.foot{margin-top:auto;text-align:center;padding:24px 18px;color:var(--mute);font-size:11px}.foot span+span{margin-left:12px}

.page{min-height:100vh;display:flex;flex-direction:column}.hero{flex:1;display:flex;align-items:center;justify-content:center;padding:70px 20px 110px}.hero-inner{width:min(680px,100%);text-align:center}.eyebrow{color:var(--accent);font:700 11px ui-monospace,SFMono-Regular,monospace;letter-spacing:.18em;margin-bottom:26px}.hero h1{font-size:clamp(42px,6vw,65px);font-weight:720;letter-spacing:-.058em;line-height:1.09;margin:0}.sub{color:var(--mute);font-size:15px;line-height:1.8;max-width:530px;margin:19px auto 35px}.lookup{padding:7px;display:flex;gap:7px;border:1px solid var(--line);background:var(--sheet);border-radius:15px;box-shadow:0 12px 36px rgba(33,47,50,.035)}.lookup:focus-within{border-color:var(--accent)}.lookup input{border:0;background:transparent;color:var(--text);height:56px;padding:0 16px;font-size:17px;min-width:0;flex:1;outline:0}.lookup input::placeholder{color:var(--mute);opacity:.62}.lookup button{border:0;border-radius:10px;background:var(--accent);color:var(--accentText);font-size:13px;font-weight:700;padding:0 25px;min-width:112px}.proof{font-size:11px;letter-spacing:.06em;color:var(--mute);margin-top:21px;display:flex;align-items:center;justify-content:center;gap:12px}.proof span+span:before{content:'·';margin-right:12px}.proof i,.mini-grid,.hero-inner:before{display:none!important}
@media(max-width:640px){.top-inner{padding:0 16px;min-height:68px}.brand{font-size:11px}.lang{gap:5px}.lang select{max-width:104px;padding:0 5px;font-size:11px}.hero{padding:64px 18px 100px}.hero h1{font-size:43px}.sub{font-size:14px}.lookup input{font-size:16px;padding:0 9px}.lookup button{min-width:82px;padding:0 14px}.proof{flex-wrap:wrap;line-height:1.8}}
</style>
</head>
<body><div class="page">
<header class="topbar"><div class="top-inner"><div class="brand"><span class="brand-mark">W</span><span>WHOIS.MRWANG</span></div><div class="lang"><select id="themeSelect" class="theme-select" aria-label="Display theme"><option value="graphite">Graphite</option><option value="paper">Paper</option><option value="sand">Sand</option><option value="forest">Forest</option></select><select id="langSelect" aria-label="Language"></select></div></div></header>
<main class="hero"><div class="hero-inner"><div class="eyebrow">WHOIS · RDAP</div><h1 data-i18n="title">Domain Intelligence Console</h1><p class="sub" data-i18n="desc">Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.</p><form id="searchForm" class="lookup"><input id="domainInput" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" placeholder="example.com" aria-label="Domain name"><button type="submit" data-i18n="search">Search</button></form><div class="proof"><span>WHOIS</span><span>RDAP</span><span>DNS</span></div></div></main>
<footer class="foot"><span>© <span id="year"></span> Mr Wang</span><span>whois.mrwang.com</span></footer>
</div>
<script>
const LANGS={en:{name:'English',title:'WHOIS & RDAP Lookup',desc:'Search WHOIS, RDAP, registrar, DNS and lifecycle information for domains worldwide.',search:'Search',worldwide:'Worldwide TLD support'},zh:{name:'简体中文',title:'域名 WHOIS 查询',desc:'查询全球域名的 WHOIS、RDAP、注册商、DNS 与生命周期信息。',search:'查询',worldwide:'支持全球域名后缀'},de:{name:'Deutsch',title:'WHOIS & RDAP Lookup',desc:'WHOIS-, RDAP-, Registrar-, DNS- und Lifecycle-Daten weltweit durchsuchen.',search:'Suchen',worldwide:'Globale TLD-Unterstützung'},fr:{name:'Français',title:'Console d’intelligence de domaine',desc:'Recherchez les données WHOIS, RDAP, registrar, DNS et cycle de vie.',search:'Rechercher',worldwide:'Prise en charge mondiale des TLD'},ja:{name:'日本語',title:'ドメイン・インテリジェンス・コンソール',desc:'世界中のドメインの WHOIS、RDAP、レジストラ、DNS、ライフサイクル情報を検索。',search:'検索',worldwide:'世界中のTLDに対応'},es:{name:'Español',title:'Consola de inteligencia de dominios',desc:'Consulta WHOIS, RDAP, registrador, DNS y ciclo de vida de dominios.',search:'Buscar',worldwide:'Compatibilidad global con TLD'}};
const THEME_NAMES={"en": ["Theme", "Graphite", "Cloud", "Linen", "Moss"], "zh": ["外观", "石墨", "云白", "亚麻", "苔绿"], "de": ["Design", "Graphit", "Wolke", "Leinen", "Moos"], "fr": ["Thème", "Graphite", "Nuage", "Lin", "Mousse"], "ja": ["テーマ", "グラファイト", "クラウド", "リネン", "モス"], "es": ["Tema", "Grafito", "Nube", "Lino", "Musgo"]};
function translateThemes(){const names=THEME_NAMES[lang]||THEME_NAMES.en;const s=document.getElementById("themeSelect");const selected=s.value;["graphite","paper","sand","forest"].forEach((id,i)=>{const o=s.querySelector(`option[value="${id}"]`);if(o)o.textContent=names[i+1]});s.setAttribute("aria-label",names[0]);s.value=selected;}
function detectLang(){const s=localStorage.getItem('whoisLang');if(s&&LANGS[s])return s;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh'))return'zh';if(n.startsWith('de'))return'de';if(n.startsWith('fr'))return'fr';if(n.startsWith('ja'))return'ja';if(n.startsWith('es'))return'es';return'en'}let lang=detectLang();const sel=document.getElementById('langSelect');Object.entries(LANGS).forEach(([k,v])=>sel.add(new Option(v.name,k)));function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;sel.value=lang;translateThemes();document.querySelectorAll('[data-i18n]').forEach(el=>{const v=LANGS[lang][el.dataset.i18n];if(v)el.textContent=v})}sel.onchange=()=>{lang=sel.value;localStorage.setItem('whoisLang',lang);applyLang()};applyLang();function cleanDomain(v){v=(v||'').trim().toLowerCase();return v.replace(/^https?:\/\//i,'').replace(/^\/\//,'').split('/')[0].split('?')[0].split('#')[0].replace(/:\d+$/,'').replace(/\.$/,'')}document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const d=cleanDomain(document.getElementById('domainInput').value);if(d)location.href='/'+encodeURIComponent(d)};document.getElementById('year').textContent=new Date().getFullYear();

/* Theme selection persists across homepage and all domain paths */
(function(){const allowed=['graphite','paper','sand','forest'];let picked='paper';try{picked=localStorage.getItem('whoisTheme')||'paper'}catch(e){}if(!allowed.includes(picked))picked='paper';const element=document.getElementById('themeSelect');function setTheme(theme){document.documentElement.dataset.theme=theme;element.value=theme;try{localStorage.setItem('whoisTheme',theme)}catch(e){}const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content={graphite:'#101318',paper:'#f5f6f4',sand:'#f5f1e9',forest:'#111a18'}[theme]}element.addEventListener('change',()=>setTheme(element.value));setTheme(picked)})();
</script></body></html>
